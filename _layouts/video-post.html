---
layout: blog
---

<div class='mod modBlogPost big no_bg'>
  {% if page.images and page.images[0] %}
    <div class='images'>
      {% for image in page.images  %}
        <div class="youtube-video-container">
          <iframe
            width="560"
            height="315"
            frameborder="0"
            allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <div class='content'>
    {% include post-meta.html post=page %}
    
    <h3 class="deco">{{ page.title }}</h3>

    {{ content }}
  </div>
</div>

<a id='comments'></a>

<div class='comments-wrapper'>

  {% if site.disqus.shortname %}
    {% include disqus_comments.html %}
  {% endif %}

</div>
