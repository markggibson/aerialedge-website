<div class='mod modIconText moveup' data-delay='0'>
  <div class='icon-text-advanced' data-bg="{{ include.service.bg | relative_url }}">
    <div class='wrapper'>
     <div class='content'>
         <i class='{{ include.service.icon }}'></i> 
      </div> 
    </div>
    <h2>{{ include.service.title | escape }}</h2>
    <p><h3>{{ include.service.desc1 | escape }}</h3></p>
    <p><h4>{{ include.service.desc2 | escape }}</h4></p>
    <p><h4>{{ include.service.desc3 | escape }}</h4></p>
    <div class="spacing"></div>
  </div>
</div>
