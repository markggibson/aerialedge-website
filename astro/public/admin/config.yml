# Sveltia v0.159.2 pinned 2026-05-16
# Release: https://github.com/sveltia/sveltia-cms/releases/tag/v0.159.2
#
# SCHEMA MIRROR — the other file is astro/src/content.config.ts.
# Keep these in sync field-for-field for posts + works + landing-pages + homepage + newsletter.
# (landing-pages added 2026-05-16 task #207; homepage singleton 2026-05-17 task #210;
#  newsletter added 2026-06-13 task #678.)
# When you change a field here, change it there too (and vice versa). See migration plan §5.

backend:
  name: github
  repo: markggibson/aerialedge-website
  # Task #215 (2026-05-17): Sveltia commits land on `staging`, never on
  # `main`. The staging branch auto-deploys to
  # https://aerialedge.co.uk/preview/ via deploy-staging.yml. Mark promotes
  # to apex by running the publish-to-production.yml workflow in the
  # GitHub Actions UI, which fast-forwards main to staging HEAD and
  # triggers the existing deploy-prod.yml.
  branch: staging
  base_url: https://sveltia-auth.mark-80a.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: "Create {{collection}} '{{slug}}' (Sveltia)"
    update: "Update {{collection}} '{{slug}}' (Sveltia)"
    delete: "Delete {{collection}} '{{slug}}' (Sveltia)"
    uploadMedia: "Upload '{{path}}' (Sveltia)"
    deleteMedia: "Delete '{{path}}' (Sveltia)"

# Direct-to-branch commits (no editorial workflow). Combined with the
# staging→preview→publish flow above, this gives Mark a save-and-preview
# experience with an explicit manual promote-to-prod step.
publish_mode: simple

# Media — new uploads land here. Legacy /assets/images/ tree stays Rochen-resident.
media_folder: "astro/public/assets/images/cms"
public_folder: "/assets/images/cms"

# Site URL for "View on site" links from the editor.
# Phase 7b (2026-05-16) — flipped to apex after cutover.
site_url: https://aerialedge.co.uk/
display_url: https://aerialedge.co.uk/
logo_url: /assets/images/AELogoWhiteOnly-sm.png

collections:
  # ─── posts ────────────────────────────────────────────────────────────────
  # Mirrors content.config.ts `posts`. Files: src/content/posts/YYYY-MM-DD-<slug>.md
  - name: posts
    label: Blog posts
    label_singular: Blog post
    folder: astro/src/content/posts
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    path: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: author, label: Author, widget: string, required: false }
      - name: images
        label: Images
        widget: list
        required: false
        summary: "{{fields.image}}"
        field: { name: image, label: Image, widget: image }
      - name: categories
        label: Categories
        widget: list
        required: false
        default: []
        field: { name: category, label: Category, widget: string }
      - name: tags
        label: Tags
        widget: list
        required: false
        default: []
        field: { name: tag, label: Tag, widget: string }
      - { name: excerpt, label: Excerpt, widget: text, required: false }
      - { name: isVideoPost, label: Video post?, widget: boolean, required: false, default: false }
      - { name: draft, label: Draft, widget: boolean, required: false, default: false }
      - { name: body, label: Body, widget: markdown }

  # ─── works ────────────────────────────────────────────────────────────────
  # Mirrors content.config.ts `works`. Files: src/content/works/<slug>.md
  # Slug constraint: lowercase letters, digits and hyphens only — keeps clean
  # URLs and avoids the v1 `&`/mixed-case filename trap (plan §11 R2).
  - name: works
    label: Portfolio works
    label_singular: Work
    folder: astro/src/content/works
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    sortable_fields: [title, date]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: slug, label: Slug, widget: string, pattern: ["^[a-z0-9-]+$", "lowercase letters, digits and hyphens only"] }
      - { name: thumbnail, label: Thumbnail, widget: image }
      - name: slides
        label: Slides
        widget: list
        required: false
        default: []
        summary: "{{fields.slide}}"
        field: { name: slide, label: Slide, widget: image }
      - name: categories
        label: Categories
        widget: list
        required: false
        default: []
        field: { name: category, label: Category, widget: string }
      - { name: date, label: Date label, widget: string, required: false, hint: "Free-text date label, e.g. 'January, 2023'" }
      - { name: client, label: Client, widget: string, required: false }
      - name: link
        label: Call-to-action link
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: text, label: Link text, widget: string }
          - { name: url, label: Link URL, widget: string }
      # Task #312 stage 2 (2026-05-26) — SEO meta. Optional. When set, these
      # drive the page <title> and <meta description> while the visible H3
      # and SectionTitle keep using `title` above.
      - { name: metaTitle, label: "SEO meta title (optional)", widget: string, required: false, hint: "Page <title>. ~50-60 chars. Falls back to Title above if blank." }
      - { name: metaDescription, label: "SEO meta description (optional)", widget: text, required: false, hint: "Page <meta description>. ~150-155 chars. Falls back to site default if blank." }
      - { name: body, label: Body, widget: markdown }

  # ─── landing-pages ────────────────────────────────────────────────────────
  # Mirrors content.config.ts `landing-pages` (task #207, 2026-05-16).
  # Files: astro/src/content/landing-pages/<slug>.md
  #
  # Campaign-style URL-shareable landing pages. Live at /<slug>/ at apex,
  # NOT linked from nav or home. Mark types the slug; it becomes the URL.
  #
  # Slug constraint matches the Zod regex in content.config.ts. A build-time
  # collision check in src/pages/[landing_slug].astro additionally rejects
  # any slug that conflicts with an existing route — see that file for the
  # full reserved-slug list.
  - name: landing-pages
    label: Landing Pages
    label_singular: Landing Page
    folder: astro/src/content/landing-pages
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    sortable_fields: [date, title]
    editor:
      preview: true
    fields:
      - { name: title, label: Title, widget: string }
      - name: slug
        label: Slug (URL path)
        widget: string
        hint: "Lowercase letters, digits, single hyphens. e.g. summer-2026. Lives at aerialedge.co.uk/<slug>/."
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "lowercase letters/digits with single hyphens, no leading/trailing hyphen"]
      - name: category
        label: Category (small-title kicker)
        widget: string
        required: false
        hint: "Optional. Renders as a small-title line above the page title in the body column. e.g. Events, Programmes, Campaign. Leave empty to omit."
      - { name: hero_image, label: Hero image, widget: image, required: false }
      - name: cta
        label: Call-to-action button
        widget: object
        required: false
        collapsed: true
        hint: "Both fields required if used — leave both empty to omit the button."
        fields:
          - { name: text, label: Button text, widget: string }
          - { name: url, label: Button URL, widget: string }
      - { name: draft, label: Draft, widget: boolean, required: false, default: false }
      - { name: date, label: Date, widget: datetime, required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: body, label: Body, widget: markdown }

  # ─── newsletter ───────────────────────────────────────────────────────────
  # Mirrors content.config.ts `newsletter` (Wynn task #678, 2026-06-13).
  # Files: astro/src/content/newsletter/<year>/<slug>.md
  #
  # Mark's decisions (#678):
  #   - Architecture: Markdown lift + Sveltia publish (newsletter app at
  #     library.aerialedge.co.uk is bypassed for the archive flow).
  #   - URL: /newsletter/<year>/<slug>/.
  #   - Image hosting: committed to astro/public/assets/images/newsletter/<slug>/
  #     (this collection's `media_folder` override below).
  #
  # Marlow's publish flow on each newsletter send:
  #   1. In Sveltia: New Newsletter → fill subject, preheader, date,
  #      upload hero image, paste markdown body.
  #   2. Hit Save → Sveltia commits to the staging branch.
  #   3. Promote to prod via the publish-to-production.yml workflow.
  - name: newsletter
    label: Newsletter
    label_singular: Newsletter issue
    folder: astro/src/content/newsletter
    create: true
    delete: true
    # Slug pattern includes a YYYY/ year segment so Sveltia writes
    # newsletter/<year>/<slug>.md, matching the on-disk + URL shape.
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    path: "{{year}}/{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: yaml-frontmatter
    # Per-collection image folder override — keeps newsletter media isolated
    # under /assets/images/newsletter/ so Mark's #4 decision (commit to repo,
    # ~500 MB-1 GB total) is auditable in one tree.
    media_folder: "/astro/public/assets/images/newsletter"
    public_folder: "/assets/images/newsletter"
    summary: "{{subject}} — {{date | date('YYYY-MM-DD')}}"
    sortable_fields: [date, subject]
    fields:
      - { name: subject, label: Subject line, widget: string, hint: "The email subject line — also used as the <h1> and <title> on the web page." }
      - { name: date, label: Send date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: slug, label: Slug (URL path), widget: string, pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "lowercase letters/digits with single hyphens, no leading/trailing hyphen"], hint: "Lowercase letters, digits, single hyphens. Becomes the URL: aerialedge.co.uk/newsletter/<year>/<slug>/." }
      - { name: preheader, label: Preheader (preview text), widget: string, required: false, hint: "The preview line shown under the subject in the inbox. Also used as the page meta description." }
      - { name: hero_image, label: Hero image, widget: image, required: false, hint: "First image, rendered at the top of the page." }
      - { name: preview_excerpt, label: Preview excerpt (for archive index), widget: text, required: false, hint: "Short summary shown on the /newsletter/ archive page. Falls back to preheader, then the first ~30 words of the body." }
      - { name: draft, label: Draft, widget: boolean, required: false, default: false }
      - { name: body, label: Body, widget: markdown }

  # ─── homepage (singleton) ─────────────────────────────────────────────────
  # Mirrors content.config.ts `homepage` (task #210, 2026-05-17).
  # File: astro/src/content/homepage/index.md
  #
  # Files-collection mode — Mark sees ONE entry called "Homepage" in the
  # Sveltia sidebar. No create/delete. The schema is rich; every editable
  # block on aerialedge.co.uk/ has a field here. Renderer:
  # astro/src/pages/index.astro.
  #
  # Auto-pulled / hardcoded blocks (NOT in this schema):
  #   - Latest 3 articles (auto-pulled from posts)
  #   - GHL newsletter form + Address + Vimeo embed (ContactForm.astro)
  #   - Social block (SocialNetworks.astro)
  #   - FooterMenu (BaseLayout)
  - name: homepage
    label: Homepage
    label_singular: Homepage
    editor:
      preview: false
    files:
      - name: index
        label: Homepage
        file: astro/src/content/homepage/index.md
        fields:
          # Block 1: Hero (one-pager top)
          - name: hero
            label: Hero (top of page)
            widget: object
            collapsed: true
            fields:
              - { name: small_title, label: Small title (kicker), widget: string }
              - name: title_lines
                label: Title lines (each line styled fir / sec / thir by position)
                widget: list
                hint: "Three lines for the big H1. First gets .fir, second .sec, third+ .thir."
                field: { name: line, label: Line, widget: string }
              - name: cta_buttons
                label: CTA buttons (Book / Tickets / Store)
                widget: list
                required: false
                default: []
                summary: "{{fields.text}} → {{fields.url}}"
                fields:
                  - { name: text, label: Button text, widget: string }
                  - { name: url, label: Button URL, widget: string }
                  - { name: target, label: Link target (e.g. _blank), widget: string, required: false }
              - { name: body_html, label: Body paragraph (HTML allowed for inline links), widget: text, hint: "Inline HTML allowed — used today for the 'Sign up for our newsletter' anchor." }
              - { name: video_src, label: Hero background video src, widget: string, hint: "e.g. /assets/images/@stock/Hero2.mp4" }

          # Block 3: About
          - name: about
            label: About section
            widget: object
            collapsed: true
            fields:
              - { name: small_title, label: Small title (kicker), widget: string }
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: image, label: Image, widget: image }

          # Block 4: Intensive callout (dark band, first one)
          - name: intensive
            label: Intensive callout (dark band)
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
              - name: button
                label: Button
                widget: object
                fields:
                  - { name: text, label: Button text, widget: string }
                  - { name: url, label: Button URL, widget: string }
                  - { name: target, label: Link target (e.g. _blank), widget: string, required: false }

          # Block 5: Works grid (Masonry) — tiles reference the works collection
          - name: works_section
            label: Works grid (Masonry)
            widget: object
            collapsed: true
            fields:
              - { name: small_title, label: Small title (kicker), widget: string }
              - { name: title, label: Title, widget: string }
              - { name: intro, label: Intro paragraph, widget: text }
              - name: tiles
                label: Tiles (each references a Portfolio Work by slug)
                widget: list
                summary: "{{fields.work}}{{#if fields.style}} ({{fields.style}}){{/if}}"
                hint: "Each tile points at an existing Portfolio Work by its slug. Build fails loudly if a slug doesn't exist."
                fields:
                  - name: work
                    label: Work
                    widget: relation
                    collection: works
                    value_field: "{{slug}}"
                    search_fields: [title, slug]
                    display_fields: [title]
                  - { name: style, label: Tile style, widget: select, options: ["", "wide"], required: false, hint: "Empty = standard (500x350). 'wide' = double-width (1000x350)." }

          # Blocks 6 + 7: Gift Vouchers + Clothing Store (side-by-side)
          - name: vouchers
            label: Gift Vouchers block
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: image, label: Image, widget: image }
              - name: button
                label: Button
                widget: object
                fields:
                  - { name: text, label: Button text, widget: string }
                  - { name: url, label: Button URL, widget: string }
                  - { name: target, label: Link target (e.g. _blank), widget: string, required: false }

          - name: store
            label: Clothing Store block
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: image, label: Image, widget: image }
              - name: button
                label: Button
                widget: object
                fields:
                  - { name: text, label: Button text, widget: string }
                  - { name: url, label: Button URL, widget: string }
                  - { name: target, label: Link target (e.g. _blank), widget: string, required: false }

          # Block 8 (audit-expanded): the alternating video-parallax + dark-callout
          # band. Ordered list of typed items — Mark can add / remove / reorder.
          - name: program_features
            label: Program features band (video parallaxes + dark callouts, alternating)
            widget: list
            required: false
            default: []
            hint: "Order matters. v1 has video → callout → video → callout → video. Add or reorder as the timetable evolves."
            types:
              - name: video
                label: Video parallax
                summary: "Video: {{fields.small_title}}"
                widget: object
                fields:
                  - { name: small_title, label: Small title (kicker), widget: string }
                  - name: title_lines
                    label: Body lines (each renders as its own h2.thin)
                    widget: list
                    field: { name: line, label: Line, widget: text }
                  - { name: video_src, label: Background video src, widget: string }
                  - name: button
                    label: Call-to-action button (optional)
                    widget: object
                    required: false
                    collapsed: true
                    fields:
                      - { name: text, label: Button text, widget: string }
                      - { name: url, label: Button URL, widget: string }
                      - { name: target, label: Link target (e.g. _blank), widget: string, required: false }
              - name: callout
                label: Dark callout
                summary: "Callout: {{fields.title}}"
                widget: object
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Body, widget: text }
                  - name: button
                    label: Call-to-action button (optional)
                    widget: object
                    required: false
                    collapsed: true
                    fields:
                      - { name: text, label: Button text, widget: string }
                      - { name: url, label: Button URL, widget: string }
                      - { name: target, label: Link target (e.g. _blank), widget: string, required: false }

          # Block 9: Pricing
          - name: pricing
            label: Pricing section
            widget: object
            collapsed: true
            fields:
              - { name: small_title, label: Small title (kicker), widget: string }
              - { name: title, label: Title, widget: string }
              - name: cards
                label: Pricing cards
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Card title, widget: string }
                  - { name: icon, label: Icon (Font Awesome class), widget: string, hint: "e.g. fa fa-heart" }
                  - name: price_tiers
                    label: Price tiers (first renders bigger as h3, rest as h4)
                    widget: list
                    field: { name: tier, label: Price tier, widget: string }

          # Block 10: Timetable
          - name: timetable
            label: Timetable block
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Title, widget: string }
              - { name: image, label: Timetable image, widget: image }
              - name: button
                label: Button
                widget: object
                fields:
                  - { name: text, label: Button text, widget: string }
                  - { name: url, label: Button URL, widget: string }
                  - { name: target, label: Link target (e.g. _blank), widget: string, required: false }

          # Block 11: Training callout (dark band, last one before articles)
          - name: training_callout
            label: Training callout (dark band, near the bottom)
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
              - name: button
                label: Button
                widget: object
                fields:
                  - { name: text, label: Button text, widget: string }
                  - { name: url, label: Button URL, widget: string }
                  - { name: target, label: Link target (e.g. _blank), widget: string, required: false }
