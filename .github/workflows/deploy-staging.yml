# Phase 7a — staging auto-deploy.
#
# Builds the Astro site under `base: '/v2/'` and ships the result to
# Rochen via FTPES. The end-to-end goal: a Sveltia commit (or any push
# to main) → live staging at https://aerialedge.co.uk/v2/ within ~2-3 min,
# with no terminal step.
#
# This workflow is a thin CI wrapper around the same Rochen plumbing
# that `astro/scripts/deploy-staging.sh` already proves manually. Env
# var names (AE_SFTP_*) match across the two on purpose so the same
# values Mark exports locally also live as GitHub Secrets here.
#
# Secrets required (set at
# https://github.com/markggibson/aerialedge-website/settings/secrets/actions ):
#   - AE_SFTP_HOST   (e.g. ftp.circushost.com)
#   - AE_SFTP_USER
#   - AE_SFTP_PASS
#   - AE_SFTP_PORT   (optional — defaults to 21)
#
# Failure mode: a missing secret or a Rochen-side error fails this
# workflow loudly in the Actions UI. v2/ stays at the last-good state
# until either fix-forward or manual `deploy-staging.sh`.
#
# Phase 7b (cutover, apex, base flip) is a separate workflow / future
# delegation — do NOT extend this file with apex-deploy logic.

name: Deploy staging (/v2/)

on:
  # Sveltia commits direct-to-main (Phase 5 P5-C), so this is the natural
  # integration point. No staging branch indirection.
  push:
    branches:
      - main
  # Manual re-run from the Actions UI (useful for re-deploying after
  # setting a secret, or recovering from a transient Rochen FTP blip).
  workflow_dispatch:

# Only one staging deploy at a time. Rapid Sveltia saves batch — only
# the newest commit deploys. Trade-off accepted per Phase 7a-H: if
# cancel-in-progress turns out to leave half-uploaded files on Rochen,
# flip to `cancel-in-progress: false` and accept a queued deploy.
concurrency:
  group: staging-deploy
  cancel-in-progress: true

# Least-privilege token. We only need to read the repo and (later) post
# status checks. No write to repo contents, no packages, no pages.
permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build /v2/ and FTP to Rochen
    runs-on: ubuntu-latest
    # Default shell. Astro project lives in the `astro/` subfolder of
    # the repo; npm steps run from there.
    defaults:
      run:
        working-directory: astro

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          # Built-in npm cache keyed on astro/package-lock.json. No
          # manual actions/cache dance needed.
          cache: 'npm'
          cache-dependency-path: 'astro/package-lock.json'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build site (SITE_BASE=/v2/)
        # `npm run build:staging` is just `SITE_BASE=/v2/ astro build`.
        # Kept as an npm script so local + CI run identical commands.
        run: npm run build:staging

      - name: Sanity-check build output
        # Same three asserts the local deploy script does. Cheap; catches
        # an empty-dist disaster before we touch Rochen.
        run: |
          test -f dist/index.html
          test -f dist/admin/index.html
          test -f dist/admin/config.yml
          test -f dist/assets/javascripts/imagesloaded.pkgd.js
          test -f dist/assets/javascripts/masonry.pkgd.min.js
          test -f dist/assets/javascripts/menu-toggler.js
          echo "Pages: $(find dist -name '*.html' | wc -l | tr -d ' ')"

      # ──────────────────────────────────────────────────────────────────
      # Step A — upload dist/ → public_html/v2/ on Rochen.
      #
      # FTP user lands inside public_html/ so server-dir of `./v2/`
      # resolves to public_html/v2/. `dangerous-clean-slate: false`
      # (the default) does a diff upload plus orphan-delete inside
      # server-dir only — never touches anything outside `./v2/`.
      #
      # `protocol: ftps` + `security: loose`: explicit-TLS on port 21,
      # accepting Rochen's hostname-mismatched cert. Matches what the
      # local script does with `ssl:verify-certificate no`.
      # ──────────────────────────────────────────────────────────────────
      - name: Deploy dist/ → /v2/ on Rochen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.AE_SFTP_HOST }}
          username: ${{ secrets.AE_SFTP_USER }}
          password: ${{ secrets.AE_SFTP_PASS }}
          port: ${{ secrets.AE_SFTP_PORT || 21 }}
          protocol: ftps
          security: loose
          # `local-dir` is resolved from the REPO ROOT regardless of the
          # job-level working-directory, per FTP-Deploy-Action's docs.
          local-dir: ./astro/dist/
          server-dir: ./v2/
          # Default behaviour — only upload changed files; delete remote
          # orphans inside server-dir only.
          dangerous-clean-slate: false
          # Keep .DS_Store / macOS metadata noise out of Rochen.
          exclude: |
            **/.DS_Store
            **/._*

      # ──────────────────────────────────────────────────────────────────
      # Step B — vendored-JS root-asset sync (Phase 7a / task #198 fix).
      #
      # Astro emits <script src="/assets/javascripts/..."> root-relative
      # by design (P6-E). v1 never had these three files at
      # public_html/assets/javascripts/, so v2 was 404'ing them and the
      # homepage Masonry grid broke until someone manually patched.
      #
      # Fix: mirror astro/public/assets/javascripts/ → /assets/javascripts/
      # on Rochen. The source directory contains exactly the vendored
      # allowlist (3 files today). `dangerous-clean-slate: false` keeps
      # any unrelated root content safe. The server-dir is the literal
      # `./assets/javascripts/` subpath — we touch nothing else under
      # public_html/.
      #
      # Phase 7b cutover: when base flips back to '/', these files stay
      # at exactly this path — the asset side becomes a no-op for the
      # cutover. That's why we picked option (a) over option (b) for #198.
      # ──────────────────────────────────────────────────────────────────
      - name: Sync vendored JS → /assets/javascripts/ on Rochen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.AE_SFTP_HOST }}
          username: ${{ secrets.AE_SFTP_USER }}
          password: ${{ secrets.AE_SFTP_PASS }}
          port: ${{ secrets.AE_SFTP_PORT || 21 }}
          protocol: ftps
          security: loose
          local-dir: ./astro/public/assets/javascripts/
          server-dir: ./assets/javascripts/
          # IMPORTANT: do NOT enable dangerous-clean-slate here. We are
          # writing inside v1's asset tree; orphan-delete on this path
          # is forbidden until Phase 7b cutover restructures public_html.
          dangerous-clean-slate: false

      # ──────────────────────────────────────────────────────────────────
      # Step C — post-deploy smoke. Hard-fail if /v2/ doesn't serve 200.
      # ──────────────────────────────────────────────────────────────────
      - name: Smoke-test https://aerialedge.co.uk/v2/
        run: |
          status="$(curl -sIL -o /dev/null -w '%{http_code}' https://aerialedge.co.uk/v2/)"
          echo "Public /v2/ → HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::staging URL returned HTTP $status (expected 200)"
            exit 1
          fi
          admin_status="$(curl -sIL -o /dev/null -w '%{http_code}' https://aerialedge.co.uk/v2/admin/)"
          echo "Admin /v2/admin/ → HTTP $admin_status"
          # Admin can return 200 or 304 depending on JS state. Don't fail
          # on the admin probe; Mark verifies the OAuth round-trip in
          # browser when it matters.
