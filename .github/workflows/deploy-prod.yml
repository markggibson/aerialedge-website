# Phase 7b — production auto-deploy (apex).
#
# Builds the Astro site with the default `base: '/'` and ships the
# result to Rochen's webroot via FTPES. End-to-end goal: a Sveltia
# commit (or any push to main) → live apex at https://aerialedge.co.uk/
# within ~2-3 min, with no terminal step.
#
# Replaces .github/workflows/deploy-staging.yml — that file is deleted
# in the same commit that adds this one. Post-cutover there is exactly
# one deploy workflow in the repo.
#
# Cutover gate: the first step probes Rochen for public_html/v1-archive/.
# If absent (cutover hasn't run), the rest of the workflow is SKIPPED via
# step-level `if:` guards. This protects the apex from being auto-deployed
# over the still-live v1 between this commit landing on main and Mark
# running astro/scripts/cutover.sh. Once v1-archive/ exists, every
# subsequent push deploys normally.
#
# Critical guardrails post-cutover:
#   - `dangerous-clean-slate: false` (default) — diff upload + orphan-
#     delete INSIDE server-dir only. We MUST not delete anything outside
#     the paths we own.
#   - `exclude` paths cover v1-archive/** (Mark's 30-day rollback window)
#     and assets/** (shared between v1-archive and prod, Rochen-managed
#     5.8 GB tree). Both stay alive throughout deploys.
#
# Secrets required (same as Phase 7a deploy-staging.yml — already set on
# the repo at /settings/secrets/actions):
#   - AE_SFTP_HOST   (e.g. ftp.circushost.com)
#   - AE_SFTP_USER
#   - AE_SFTP_PASS
#   - AE_SFTP_PORT   (optional — defaults to 21)
#
# Failure mode: a missing secret or a Rochen-side error fails this
# workflow loudly in the Actions UI. The apex stays at the last-good
# state until either fix-forward or local `astro/scripts/deploy-prod.sh`.

name: Deploy production (apex)

on:
  # After cutover, Sveltia commits direct-to-main → apex auto-deploy.
  # Same trigger model as Phase 7a deploy-staging.yml, just retargeted.
  push:
    branches:
      - main
  # Manual re-run from the Actions UI (useful for re-deploying after
  # rotating a secret or recovering from a transient Rochen FTP blip).
  workflow_dispatch:

# Only one prod deploy at a time. Rapid Sveltia saves batch — only the
# newest commit deploys. Trade-off accepted per Phase 7b-G. If the
# cancel-in-progress behaviour leaves half-uploaded files on Rochen in
# practice, flip to `cancel-in-progress: false`.
concurrency:
  group: prod-deploy
  cancel-in-progress: true

# Least-privilege token — same as staging workflow.
permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build apex and FTP to Rochen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro

    steps:
      # ──────────────────────────────────────────────────────────────────
      # Step 0 — cutover gate. Refuse to run until cutover has completed
      # on Rochen (signalled by the presence of public_html/v1-archive/).
      #
      # WHY: between this workflow merging to main and Mark running
      # cutover.sh, every push to main would otherwise auto-deploy the
      # apex-shape build over v1, partially flattening v1 BEFORE the
      # snapshot is taken and BEFORE v1-archive/ is created. The cutover
      # script's pre-flight assertions can't recover from that.
      #
      # The gate: connect via FTPES, `cls -d v1-archive`. If it exists
      # (exit 0, lftp prints the dir), continue. If not (exit non-zero),
      # SKIP the rest of the workflow gracefully so the push doesn't
      # appear as a red failure run in the Actions UI.
      #
      # Once Mark has run cutover.sh successfully, v1-archive/ exists
      # and this step passes on every subsequent push.
      # ──────────────────────────────────────────────────────────────────
      - name: Pre-flight — has cutover happened?
        id: cutover_gate
        working-directory: .
        env:
          AE_SFTP_HOST: ${{ secrets.AE_SFTP_HOST }}
          AE_SFTP_USER: ${{ secrets.AE_SFTP_USER }}
          AE_SFTP_PASS: ${{ secrets.AE_SFTP_PASS }}
          AE_SFTP_PORT: ${{ secrets.AE_SFTP_PORT || 21 }}
        run: |
          sudo apt-get -qq update >/dev/null
          sudo apt-get -qq install -y lftp >/dev/null
          # Build the lftp command list as a single string (no heredoc
          # inside a YAML run: block — too easy to break indentation).
          lftp_cmds="set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          set net:max-retries 1
          set net:reconnect-interval-base 5
          set net:timeout 30
          user \"$AE_SFTP_USER\" \"$AE_SFTP_PASS\"
          cls -1 v1-archive
          bye"
          set +e
          listing="$(printf '%s\n' "$lftp_cmds" | lftp -p "$AE_SFTP_PORT" "ftp://$AE_SFTP_HOST" 2>&1)"
          rc=$?
          set -e
          echo "lftp exit=$rc"
          echo "--- lftp output ---"
          echo "$listing"
          echo "--- end lftp output ---"
          # cls of a missing dir produces 'access failed', '550' or similar.
          # If lftp returns non-zero OR we detect those signals, the cutover
          # has not run yet.
          if [ "$rc" -ne 0 ] || echo "$listing" | grep -qiE "access failed|no such file|not found|550"; then
            echo "cutover_done=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v1-archive/ not found on Rochen — cutover has not run yet."
            echo "::notice::Skipping production deploy. Run astro/scripts/cutover.sh first."
          else
            echo "cutover_done=true" >> "$GITHUB_OUTPUT"
            echo "v1-archive/ present on Rochen — proceeding with apex deploy."
          fi

      - name: Checkout repo
        if: steps.cutover_gate.outputs.cutover_done == 'true'
        uses: actions/checkout@v4

      - name: Setup Node 26
        if: steps.cutover_gate.outputs.cutover_done == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'astro/package-lock.json'

      - name: Install dependencies (npm ci)
        if: steps.cutover_gate.outputs.cutover_done == 'true'
        run: npm ci

      - name: Build site (default base, SITE_BASE unset)
        if: steps.cutover_gate.outputs.cutover_done == 'true'
        # `npm run build` defaults to base: '/' per astro.config.mjs.
        # Apex serves at the root, so no SITE_BASE override here.
        run: npm run build

      - name: Sanity-check build output
        if: steps.cutover_gate.outputs.cutover_done == 'true'
        # Same asserts as the staging workflow. Cheap; catches an
        # empty-dist disaster before we touch Rochen.
        run: |
          test -f dist/index.html
          test -f dist/admin/index.html
          test -f dist/admin/config.yml
          test -f dist/assets/javascripts/imagesloaded.pkgd.js
          test -f dist/assets/javascripts/masonry.pkgd.min.js
          test -f dist/assets/javascripts/menu-toggler.js
          echo "Pages: $(find dist -name '*.html' | wc -l | tr -d ' ')"
          # Confirm the build is apex-shaped, not staging-shaped — no
          # /v2/ should appear in any internal href in dist/index.html.
          if grep -q 'href="/v2/' dist/index.html; then
            echo "::error::dist/index.html contains /v2/ hrefs. SITE_BASE leaked into the prod build."
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────
      # Step A — upload dist/ → public_html/ root on Rochen.
      #
      # FTP user lands inside public_html/ so server-dir of `./` resolves
      # to public_html/. `dangerous-clean-slate: false` (the default)
      # does a diff upload plus orphan-delete inside server-dir only —
      # AND we explicitly exclude v1-archive/** and assets/** so those
      # never get touched.
      #
      # `protocol: ftps` + `security: loose`: explicit-TLS on port 21,
      # accepting Rochen's hostname-mismatched cert. Matches what the
      # local script does with `ssl:verify-certificate no`.
      # ──────────────────────────────────────────────────────────────────
      - name: Deploy dist/ → apex root on Rochen
        if: steps.cutover_gate.outputs.cutover_done == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.AE_SFTP_HOST }}
          username: ${{ secrets.AE_SFTP_USER }}
          password: ${{ secrets.AE_SFTP_PASS }}
          port: ${{ secrets.AE_SFTP_PORT || 21 }}
          protocol: ftps
          security: loose
          local-dir: ./astro/dist/
          server-dir: ./
          dangerous-clean-slate: false
          # CRITICAL post-cutover excludes — these paths live OUTSIDE the
          # new build and must not be diffed against dist/:
          #   v1-archive/** — Mark's 30-day rollback window (~30-60 MB
          #     of v1 Jekyll source). Deleted manually after 30 days.
          #   assets/**     — 5.8 GB Rochen-resident shared asset tree.
          #     The vendored-JS allowlist (3 files) is synced separately
          #     in Step B.
          #   .well-known/** — Let's Encrypt ACME challenge dir (Rochen-
          #     managed; FTP-Deploy-Action won't usually delete dotfiles
          #     but excluding for safety).
          #   .ftpquota — Rochen auto-regenerates; exclude to keep the
          #     diff stable.
          # macOS metadata noise:
          exclude: |
            **/.DS_Store
            **/._*
            v1-archive/**
            assets/**
            .well-known/**
            .ftpquota

      # ──────────────────────────────────────────────────────────────────
      # Step B — vendored-JS root-asset sync (carries forward from
      # Phase 7a / task #198).
      #
      # The three vendored JS files (masonry, imagesloaded, menu-toggler)
      # live at /assets/javascripts/ which is excluded from Step A above
      # (assets/** exclude). So sync them as a second narrow upload —
      # same source dir, same target path as Phase 7a, exact-same files.
      #
      # Post-cutover this step is mostly defence-in-depth: the files
      # already sit at public_html/assets/javascripts/ from Phase 7a.
      # Re-uploading them is harmless and protects against accidental
      # deletion. NEVER enable dangerous-clean-slate here — we'd nuke
      # v1's full /assets/ subtree.
      # ──────────────────────────────────────────────────────────────────
      - name: Sync vendored JS → /assets/javascripts/ on Rochen
        if: steps.cutover_gate.outputs.cutover_done == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.AE_SFTP_HOST }}
          username: ${{ secrets.AE_SFTP_USER }}
          password: ${{ secrets.AE_SFTP_PASS }}
          port: ${{ secrets.AE_SFTP_PORT || 21 }}
          protocol: ftps
          security: loose
          local-dir: ./astro/public/assets/javascripts/
          server-dir: ./assets/javascripts/
          # CRITICAL: must stay false. Orphan-delete here would touch
          # v1's broader asset tree.
          dangerous-clean-slate: false

      # ──────────────────────────────────────────────────────────────────
      # Step C — post-deploy smoke. Hard-fail if apex doesn't serve 200,
      # OR if /v2/ references appear in the served HTML (which would
      # mean the deployed build was staging-shaped, not apex-shaped).
      # ──────────────────────────────────────────────────────────────────
      - name: Smoke-test https://aerialedge.co.uk/
        if: steps.cutover_gate.outputs.cutover_done == 'true'
        run: |
          status="$(curl -sIL -o /dev/null -w '%{http_code}' https://aerialedge.co.uk/)"
          echo "Public apex → HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::apex URL returned HTTP $status (expected 200)"
            exit 1
          fi

          # Apex HTML must not contain /v2/ in any internal href.
          if curl -sL https://aerialedge.co.uk/ | grep -qE 'href="/v2/'; then
            echo "::error::apex HTML contains /v2/ internal hrefs. Wrong base shipped."
            exit 1
          fi

          admin_status="$(curl -sIL -o /dev/null -w '%{http_code}' https://aerialedge.co.uk/admin/)"
          echo "Admin /admin/ → HTTP $admin_status"
          # Admin can return 200 or 304 depending on JS state. Don't fail
          # on the admin probe; Mark verifies the OAuth round-trip in
          # browser when it matters.
